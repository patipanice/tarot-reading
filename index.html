<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ดูดวงไพ่ยิบซี</title>
<meta name="description" content="ดูดวงไพ่ยิบซีออนไลน์ เลือกเรื่องที่อยากถาม จั่วไพ่เอง จากสำรับ Rider-Waite-Smith ครบ 78 ใบ">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,500&family=Noto+Sans+Thai+Looped:wght@400;600&family=Noto+Serif+Thai:wght@400;500&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- คลังสัญลักษณ์: ใช้ดอกไพ่ทั้งสี่ของสำรับเองแทนไอคอนสำเร็จรูป -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <symbol id="gl-star" viewBox="0 0 24 24">
      <path d="M12 1.5l1.9 7.1 7.1 1.9-7.1 1.9-1.9 7.1-1.9-7.1L3 10.5l7.1-1.9z"
            fill="currentColor"/>
      <circle cx="12" cy="10.5" r="9" fill="none" stroke="currentColor"
              stroke-width="0.6" opacity="0.45"/>
    </symbol>
    <symbol id="gl-cups" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M6 4h12v3a6 6 0 0 1-12 0z"/>
      <path d="M12 13v5"/>
      <path d="M8 21h8"/>
      <path d="M9.5 18h5l1.5 3H8z"/>
    </symbol>
    <symbol id="gl-pentacles" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="1.3" stroke-linejoin="round">
      <circle cx="12" cy="12" r="9"/>
      <path d="M12 4.6l2.3 7.1h7.4l-6 4.4 2.3 7.1-6-4.4-6 4.4 2.3-7.1-6-4.4h7.4z"
            transform="scale(0.72) translate(4.7 4.7)"/>
    </symbol>
    <symbol id="gl-swords" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 2l2 3v10h-4V5z"/>
      <path d="M12 15v5"/>
      <path d="M8 18h8"/>
    </symbol>
    <symbol id="gl-wands" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M6 21L18 6"/>
      <path d="M15 3.5l4.5 4.5"/>
      <path d="M16.4 2.6l1.2 1.2M20.2 6.4l1.2 1.2M19.6 2.8l-1.1 1.1M21.4 4.6l-1.1 1.1"/>
    </symbol>
    <symbol id="gl-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a6.8 6.8 0 0 0 10.5 10.5z"/>
    </symbol>
    <symbol id="gl-book" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 4.5h6a2.5 2.5 0 0 1 2 1 2.5 2.5 0 0 1 2-1h6v13h-6a2.5 2.5 0 0 0-2 1 2.5 2.5 0 0 0-2-1H4z"/>
      <path d="M12 5.5v13"/>
    </symbol>
    <symbol id="gl-scroll" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M7 3h10a2 2 0 0 1 2 2v13a3 3 0 0 1-3 3H7a3 3 0 0 1-3-3V6"/>
      <path d="M4 6a2 2 0 0 1 3-1.7"/>
      <path d="M9 8h6M9 12h6M9 16h3"/>
    </symbol>
    <symbol id="gl-close" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="1.5" stroke-linecap="round">
      <path d="M6 6l12 12M18 6L6 18"/>
    </symbol>
  </defs>
</svg>

<div class="shell">

  <header class="masthead">
    <a class="wordmark" href="#/reading">
      <svg class="wordmark__mark" aria-hidden="true"><use href="#gl-star"/></svg>
      ดูดวงไพ่ยิบซี
    </a>
    <nav class="nav" id="nav" aria-label="เมนูหลัก">
      <a class="nav__link" href="#/reading">ดูดวง</a>
      <a class="nav__link" href="#/daily">ไพ่วันนี้</a>
      <a class="nav__link" href="#/library">คลังไพ่</a>
      <a class="nav__link" href="#/history">ประวัติ</a>
    </nav>
  </header>

  <main id="app"></main>

  <footer class="colophon">
    <p>
      ภาพไพ่ชุด Rider–Waite–Smith (Pamela Colman Smith, 1909) เป็นสาธารณสมบัติ
      จาก <a href="https://commons.wikimedia.org/wiki/Category:Rider-Waite_tarot_deck">Wikimedia Commons</a><br>
      ไพ่สับใหม่และสุ่มจริงทุกครั้ง ไม่มีการล็อกผล — อ่านไว้เป็นแง่คิด ไม่ใช่คำชี้ขาดของชีวิต
    </p>
  </footer>

</div>

<dialog class="sheet" id="card-sheet" aria-label="รายละเอียดไพ่">
  <button class="sheet__close" type="button" data-close-sheet aria-label="ปิด">
    <svg width="18" height="18" aria-hidden="true"><use href="#gl-close"/></svg>
  </button>
  <div class="sheet__body" id="card-sheet-body"></div>
</dialog>

<script src="js/data/cards-major.js"></script>
<script src="js/data/cards-minor.js"></script>
<script src="js/data/cards.js"></script>
<script src="js/data/spreads.js"></script>
<script src="js/data/topics.js"></script>
<script src="js/shuffle.js"></script>
<script src="js/interpret.js"></script>
<script src="js/storage.js"></script>
<script src="js/ui.js"></script>
<script src="js/views/reading.js"></script>
<script src="js/views/daily.js"></script>
<script src="js/views/library.js"></script>
<script src="js/views/history.js"></script>
<script src="js/app.js"></script>
</body>
</html>
